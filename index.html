<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker App</title>
    
    <!-- PWA Settings -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4f46e5">
    <link rel="apple-touch-icon" href="icon-192.png">

    <!-- Tailwind CSS & Chart.js -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans pb-12">

    <!-- PWA Custom Install Banner (จะเด้งขึ้นมาถ้าเครื่องยังไม่ได้ติดตั้งแอป) -->
    <div id="pwa-install-banner" class="hidden fixed bottom-4 left-4 right-4 md:left-auto md:right-4 md:w-96 bg-white p-4 rounded-xl shadow-2xl border border-indigo-100 flex items-center justify-between z-50 transition-all duration-300">
        <div class="flex items-center space-x-3">
            <!-- จุดใส่โลโก้แอปของคุณชินอิจิ -->
            <img src="icon-192.png" alt="App Logo" class="w-12 h-12 rounded-lg object-cover bg-indigo-50">
            <div>
                <h4 class="font-bold text-gray-800 text-sm">ติดตั้ง Expense App</h4>
                <p class="text-xs text-gray-500">บันทึกรายรับ-รายจ่ายได้สะดวกรวดเร็ว</p>
            </div>
        </div>
        <div class="flex items-center space-x-2">
            <button id="pwa-close-btn" class="text-gray-400 hover:text-gray-600 text-sm px-2 py-1">ไว้ทีหลัง</button>
            <button id="pwa-install-btn" class="bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-semibold px-3 py-2 rounded-lg shadow transition">
                ติดตั้ง
            </button>
        </div>
    </div>

    <div class="max-w-4xl mx-auto p-4 sm:p-6 lg:p-8 mt-4">
        <h1 class="text-3xl font-bold text-center text-indigo-600 mb-8">ระบบบันทึกรายรับ-รายจ่าย</h1>
        
        <!-- Dashboard สรุปยอดการเงิน -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8">
            <div class="bg-white p-6 rounded-xl shadow-sm border-l-4 border-green-500">
                <h3 class="text-sm font-medium text-gray-500">รายรับทั้งหมด</h3>
                <p class="text-2xl font-bold text-green-600" id="total-income">฿0.00</p>
            </div>
            <div class="bg-white p-6 rounded-xl shadow-sm border-l-4 border-red-500">
                <h3 class="text-sm font-medium text-gray-500">รายจ่ายทั้งหมด</h3>
                <p class="text-2xl font-bold text-red-600" id="total-expense">฿0.00</p>
            </div>
            <div class="bg-white p-6 rounded-xl shadow-sm border-l-4 border-indigo-500">
                <h3 class="text-sm font-medium text-gray-500">ยอดเงินคงเหลือ</h3>
                <p class="text-2xl font-bold text-indigo-600" id="net-balance">฿0.00</p>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            <!-- ฟอร์มกรอกข้อมูลรายการ -->
            <div class="bg-white p-6 rounded-xl shadow-sm">
                <h2 class="text-xl font-semibold mb-4">เพิ่มรายการใหม่</h2>
                <form id="transaction-form" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700">วันที่</label>
                        <input type="date" id="date" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border focus:border-indigo-500 focus:ring-indigo-500">
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700">ประเภท</label>
                            <select id="type" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border">
                                <option value="expense">รายจ่าย</option>
                                <option value="income">รายรับ</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700">หมวดหมู่</label>
                            <select id="category" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border">
                                <option value="อาหาร">อาหาร</option>
                                <option value="เดินทาง">เดินทาง</option>
                                <option value="ช้อปปิ้ง">ช้อปปิ้ง</option>
                                <option value="บิล">บิลต่างๆ</option>
                                <option value="เงินเดือน">เงินเดือน</option>
                                <option value="อื่นๆ">อื่นๆ</option>
                            </select>
                        </div>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">จำนวนเงิน (บาท)</label>
                        <input type="number" id="amount" required min="1" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">บันทึกช่วยจำ</label>
                        <input type="text" id="note" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border">
                    </div>
                    <button type="submit" class="w-full bg-indigo-600 text-white p-2 rounded-md hover:bg-indigo-700 transition">บันทึกรายการ</button>
                </form>
            </div>

            <!-- ส่วนแสดงกราฟสัดส่วนค่าใช้จ่าย -->
            <div class="bg-white p-6 rounded-xl shadow-sm flex flex-col items-center">
                <h2 class="text-xl font-semibold mb-4 w-full">สัดส่วนค่าใช้จ่าย</h2>
                <div class="w-full max-w-[250px] mb-6">
                    <canvas id="expenseChart"></canvas>
                </div>
            </div>
        </div>

        <!-- ตารางประวัติการทำรายการ -->
        <div class="bg-white p-6 rounded-xl shadow-sm mt-8 overflow-x-auto">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl font-semibold">ประวัติการทำรายการ</h2>
                <button onclick="resetAllData()" class="bg-red-50 text-red-600 border border-red-200 px-4 py-2 rounded-md hover:bg-red-600 hover:text-white transition text-sm font-medium">
                    🗑️ ล้างข้อมูลทั้งหมด
                </button>
            </div>
            <table class="min-w-full divide-y divide-gray-200">
                <thead>
                    <tr>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">วันที่</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">ประเภท</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">หมวดหมู่</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">รายละเอียด</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">จำนวนเงิน</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">จัดการ</th>
                    </tr>
                </thead>
                <tbody id="transaction-list" class="divide-y divide-gray-200">
                    <!-- ข้อมูลรายการจะถูกเรนเดอร์ด้วย JS -->
                </tbody>
            </table>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
